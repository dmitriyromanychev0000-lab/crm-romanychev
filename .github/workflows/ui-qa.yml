name: Mobile UI QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ui-qa.yml"
      - ".github/ui-qa-trigger"
      - "qa/ui-smoke.cjs"

jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run mobile UI smoke
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/crm-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node qa/ui-smoke.cjs

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-qa-artifacts
          path: ui-qa-artifacts
          if-no-files-found: warn
          retention-days: 7
