name: Mobile UI QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ui-qa.yml"
      - ".github/ui-qa-trigger"
      - "qa/ui-smoke.cjs"
      - "app.js"
      - "styles.css"
      - "mobile-v2.css"
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"

permissions:
  contents: write

jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run mobile UI smoke
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/crm-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node qa/ui-smoke.cjs

      - name: Persist latest QA report
        if: always()
        run: |
          if [ -f ui-qa-artifacts/report.json ]; then
            cp ui-qa-artifacts/report.json qa/latest-ui-qa-report.json
          else
            printf '%s\n' '{"generatedAt":null,"results":[],"failures":[{"type":"workflow-fatal","message":"UI smoke did not produce report.json"}]}' > qa/latest-ui-qa-report.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/latest-ui-qa-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Update mobile UI QA report"
            git push
          fi

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-qa-artifacts
          path: ui-qa-artifacts
          if-no-files-found: warn
          retention-days: 7
